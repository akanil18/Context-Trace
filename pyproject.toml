[project]
name = "context-compiler"
version = "0.1.0"
description = "AST-aware context optimization system for LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "lancedb>=0.37.1",
    "networkx>=3.4.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "sentence-transformers>=6.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
